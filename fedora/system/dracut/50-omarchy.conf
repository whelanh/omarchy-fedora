# Omarchy Quattro for Fedora - dracut (initramfs) configuration
#
# Fedora uses dracut for initramfs (Arch uses mkinitcpio). This config
# mirrors the relevant upstream mkinitcpio module set where applicable.
#
# Install in /etc/dracut.conf.d/ and then regenerate: dracut --regenerate-all

# Include the plugged-in kernel module drivers normally present.
add_drivers+=" thunderbolt "

# Plymouth boot splash (Omarchy ships a Plymouth theme).
add_dracutmodules+=" plymouth "

# Btrfs root support is enabled by default in Fedora's dracut; no extra
# module required.
#
# NOTE: suspend/resume (hibernation) will need the separate resume config
# generated dynamically; see fedora/scripts (hibernation is out of MVP scope).

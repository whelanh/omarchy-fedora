# Machine-readable record of the 10 "first-party" Omarchy binaries for Fedora
# RPM packaging. Grounded in the upstream omacom/omarchy-pkgs PKGBUILDs and
# each project's own build docs. status: verified = container-built in this
# repo's Fedora Rawhide container; blocked = still needs work. Packages are
# distributed via the whelanh/omarchy COPR (see fedora/rpm/README.md).
#
# Dropped from the original 13-package scope:
#   - asdcontrol: upstream archived Aug 2025, Apple Studio Display hardware only
#   - omarchy-nvim: ~116 MiB headless LazyVim cache assembly; out of RPM scope
#   - usage: shipped in-tree by the base install (upstream/bin/omarchy-agent-usage-*)

packages:
  aether:
    repo: https://github.com/omacom/aether
    language: go
    build: repack-release (upstream ships prebuilt release binary)
    binary: aether
    license: MIT
    deps: [webkit2gtk4.1, gtk3]
    status: verified
    version: 4.29.8
    note: Repack of aether-linux-amd64; desktop + aether:// url-handler + icons. Container-built OK.
  cliamp:
    repo: https://github.com/bjarneo/cliamp
    language: go
    build: repack-release (upstream ships prebuilt release binary)
    binary: cliamp
    license: MIT
    deps: [alsa-lib, ffmpeg-free, yt-dlp]
    status: verified
    version: 2.0.1
    note: Repack of cliamp-linux-amd64; desktop + Cliamp.png. Container-built OK.
  herdr:
    repo: https://github.com/herdrdev/herdr
    language: rust
    build: repack-release (PKGBUILD needs pinned Zig 0.15 linker; prebuilt ships)
    binary: herdr
    license: Apache-2.0
    deps: [gcc-libs, glibc]
    status: verified
    version: 0.8.2
    note: Repack of herdr-linux-x86_64 from herdrdev/herdr (the omacom-io/herdr fork has no release assets); Obsoletes/Provides omarchy-herdr.
  hyprland-preview-share-picker:
    repo: https://github.com/WhySoBad/hyprland-preview-share-picker
    language: rust
    build: cargo-frozen-release (requires nightly toolchain + pinned hyprland-protocols)
    binary: hyprland-preview-share-picker
    license: MIT
    deps: [gtk4, gtk4-layer-shell, xdg-desktop-portal-hyprland, hyprland, slurp]
    status: verified
    version: 0.2.1
    note: Spec cds the pinned hyprland-protocols in (Source from hyprwm), builds on stable Fedora Rust with crates.io deps vendored for offline COPR build; needs gtk4-layer-shell-devel from nett00n/hyprland COPR. Container-built OK.
  omacalc:
    repo: https://github.com/omacom/omacalc
    language: cpp
    build: qmake6
    binary: omacalc
    license: MIT
    deps: [qt6-base, qt6-declarative, xdg-desktop-portal]
    status: verified
    version: 0.2.2
    note: Built in Fedora Rawhide container; Qt6 qmake6 via ./bin/build; desktop entry + svg icon + OFL added.
  omacut:
    repo: https://github.com/omacom/omacut
    language: cpp
    build: qmake6
    binary: omacut
    license: MIT
    deps: [qt6-base, qt6-declarative, qt6-multimedia, ffmpeg, ffprobe]
    status: verified
    version: 0.4.0
    note: Built in Fedora Rawhide container (v0.4.0); Qt6 trimmer, needs qt6-qtmultimedia-devel.
  omawrite:
    repo: https://github.com/omacom/omawrite
    language: cpp
    build: qmake6
    binary: omawrite
    license: MIT
    deps: [qt6-base, qt6-declarative, qt6-quickcontrols2, xdg-desktop-portal]
    status: verified
    version: 0.5.0
    note: Built in Fedora Rawhide container (v0.5.0); Qt6 markdown editor.
  tensaku:
    repo: https://github.com/jondkinney/tensaku
    language: rust
    build: repack-release (release tarball carries full install tree, no toolchain)
    binary: tensaku, tensaku-edit
    license: MPL-2.0
    deps: [gtk4, gtk4-layer-shell, libadwaita, fontconfig]
    status: verified
    version: 0.28.0
    note: Repack of tensaku-v0.28.0-x86_64.tar.gz (bin/ + share/); desktop + icon + man + completions. Container-built OK.
  tobi-try:
    repo: https://github.com/tobi/try
    language: ruby
    build: gem (try-cli)
    binary: try
    license: MIT
    deps: [ruby]
    status: verified
    version: 1.10.1
    note: Built in Fedora Rawhide container (try-cli v1.10.1 gem).
  ttfx:
    repo: https://github.com/omacom/ttfx
    language: rust
    build: cargo-release (crates.io deps vendored for offline COPR build)
    binary: ttfx
    license: MIT
    deps: []
    status: verified
    version: 0.3.2
    note: Built in Fedora Rawhide container (v0.3.2); pure Rust. Crates vendored via fedora/rpm/vendor-rust.sh; cargo build --offline --locked.
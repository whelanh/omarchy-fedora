# Machine-readable record of the "first-party" Omarchy binaries/plugins for
# Fedora RPM packaging. Grounded in the upstream omacom/omarchy-pkgs PKGBUILDs
# and each project's own build docs. status: verified = container-built in this
# repo's Fedora Rawhide container; blocked = still needs work. Packages are
# distributed via the whelanh/omarchy COPR (see fedora/rpm/README.md).
#
# elsewhen was added after the original 10: upstream now ships it as a
# dependency of the shell (install/omarchy-base.packages) and a world-clock
# bar widget. It is a noarch plugin bundle with no compile step, unlike the
# original set. hype and monologue are later first-party Qt6 apps that upstream
# added to install/omarchy-base.packages (Markdown presentations and a
# theme-synced webcam recorder), so they are packaged here too.
#
# Dropped from the original 13-package scope:
#   - asdcontrol: upstream archived Aug 2025, Apple Studio Display hardware only
#   - omarchy-nvim: ~116 MiB headless LazyVim cache assembly; out of RPM scope
#   - usage: shipped in-tree by the base install (upstream/bin/omarchy-agent-usage-*)

packages:
  aether:
    repo: https://github.com/omacom/aether
    language: go
    build: repack-release (upstream ships prebuilt release binary)
    binary: aether
    license: MIT
    deps: [webkit2gtk4.1, gtk3]
    status: verified
    version: 4.32.0
    note: Repack of aether-linux-amd64; desktop + aether:// url-handler + icons. Container-built OK.
  cliamp:
    repo: https://github.com/bjarneo/cliamp
    language: go
    build: repack-release (upstream ships prebuilt release binary)
    binary: cliamp
    license: MIT
    deps: [alsa-lib, ffmpeg-free, yt-dlp]
    status: verified
    version: 2.3.0
    note: Repack of cliamp-linux-amd64; desktop + Cliamp.png. Container-built OK.
  disktree-bin:
    repo: https://github.com/tobi/disktree
    language: rust
    build: repack-release (upstream ships prebuilt linux-x86_64 binary)
    binary: disktree
    license: MIT
    deps: [hicolor-icon-theme, vulkan-loader]
    status: verified
    version: 0.11.0
    note: Repack of disktree-0.11.0-x86_64-linux.tar.gz (Rust + GPUI disk-usage treemap, the AUR `disktree-bin`); RPM name disktree-bin, Provides disktree. Container-built OK.
  elsewhen:
    repo: https://github.com/omacom/elsewhen
    language: javascript
    build: noarch-repack (plugin file tree; no compile step)
    binary: null
    license: MIT
    deps: [quickshell, python3]
    status: verified
    version: 1.0.0
    note: World clock shell plugin; arch=any QML/JS/Python from the v1.0.0 tag archive, installed to /usr/share/omarchy/shell/plugins/omacom.elsewhen (the shell's first-party plugin directory). No `omarchy` Requires (the port owns that tree).
  herdr:
    repo: https://github.com/herdrdev/herdr
    language: rust
    build: repack-release (PKGBUILD needs pinned Zig 0.15 linker; prebuilt ships)
    binary: herdr
    license: Apache-2.0
    deps: [gcc-libs, glibc]
    status: verified
    version: 0.9.3
    note: Repack of herdr-linux-x86_64 from herdrdev/herdr (the omacom-io/herdr fork has no release assets); Obsoletes/Provides omarchy-herdr.
  hype:
    repo: https://github.com/omacom/hype
    language: cpp
    build: qmake6
    binary: hype
    license: MIT
    deps: [qt6-qtbase, qt6-qtdeclarative, qt6-qtmultimedia, qt6-qtimageformats, qt6-qtsvg, libwebp, source-highlight, ffmpeg-free, xdg-desktop-portal]
    status: verified
    version: 0.4.3
    note: Markdown presentation editor with a visual slide editor; Qt6/qmake6, shells out to source-highlight (code blocks) and ffmpeg (video/animated media export), links zlib + libwebp. Container-built OK.
  hyprland-preview-share-picker:
    repo: https://github.com/WhySoBad/hyprland-preview-share-picker
    language: rust
    build: cargo-frozen-release (requires nightly toolchain + pinned hyprland-protocols)
    binary: hyprland-preview-share-picker
    license: MIT
    deps: [gtk4, gtk4-layer-shell, xdg-desktop-portal-hyprland, hyprland, slurp]
    status: verified
    version: 0.2.1
    note: Spec cds the pinned hyprland-protocols in (Source from hyprwm), builds on stable Fedora Rust with crates.io deps vendored for offline COPR build; needs gtk4-layer-shell-devel from nett00n/hyprland COPR. Container-built OK.
  monologue:
    repo: https://github.com/omacom/monologue
    language: cpp
    build: qmake6
    binary: monologue
    license: MIT
    deps: [qt6-qtbase, qt6-qtdeclarative, qt6-qtmultimedia, pulseaudio-libs, ffmpeg-free, xdg-desktop-portal]
    status: verified
    version: 0.3.1
    note: Theme-synced webcam recorder with a built-in trim/cut editor; Qt6/qmake6 with libpulse for metering, shells out to ffmpeg/ffprobe. Container-built OK.
  omacalc:
    repo: https://github.com/omacom/omacalc
    language: cpp
    build: qmake6
    binary: omacalc
    license: MIT
    deps: [qt6-base, qt6-declarative, xdg-desktop-portal]
    status: verified
    version: 0.2.2
    note: Built in Fedora Rawhide container; Qt6 qmake6 via ./bin/build; desktop entry + svg icon + OFL added.
  omacut:
    repo: https://github.com/omacom/omacut
    language: cpp
    build: qmake6
    binary: omacut
    license: MIT
    deps: [qt6-base, qt6-declarative, qt6-multimedia, ffmpeg, ffprobe]
    status: verified
    version: 0.5.0
    note: Built in Fedora Rawhide container (v0.5.0); Qt6 trimmer, needs qt6-qtmultimedia-devel.
  omapresent:
    repo: https://github.com/jethrojones/omapresent
    language: cpp
    build: qmake6
    binary: omapresent
    license: MIT AND LicenseRef-Omarchy
    deps: [qt6-qtbase, qt6-qtdeclarative, qt6-qtwebengine, qt6-qtwebchannel, qt6-qtmultimedia, xdg-desktop-portal, hicolor-icon-theme]
    status: verified
    version: 0.1.3
    note: Markdown presentation app (successor to hype); Qt6 Quick + QtWebEngine, ships a bundled agent skill + welcome deck and theme-refresh hook. Container-built OK.
  omarchy-emacs:
    repo: https://github.com/scottjones/omarchy-emacs
    language: emacs-lisp
    build: noarch-repack (config + helper scripts; no compile)
    binary: null
    license: MIT
    deps: [emacs, bash]
    status: verified
    version: 1.10.1
    note: Omarchy Emacs integration (theme/font sync) behind the SUPER+SPACE Install > Editor > Emacs row; installs /usr/bin/omarchy-* helpers + /usr/share/omarchy-emacs. Opt-in, not in the default install set. Container-built OK.
  voxtype-bin:
    repo: https://github.com/peteonrails/voxtype
    language: rust
    build: repack-release (upstream prebuilt Whisper + OSD binaries)
    binary: voxtype
    license: MIT
    deps: [alsa-lib, curl, glibc, libgcc]
    status: verified
    version: 1.1.0
    note: Dictation backend for the SUPER+SPACE Install > AI > Dictation row (RPM name voxtype-bin, Provides voxtype); repacks only the Whisper (CPU/Vulkan) + OSD binaries, not upstream's ONNX/CUDA/MIGraphX payload. Opt-in, not in the default install set. Container-built OK.
  superwhisper-bin:
    repo: https://github.com/superultrainc/superwhisper-linux-releases
    language: binary
    build: repack-release (vendor Minisign-signed tarball + omacom/omarchy-pkgs files)
    binary: superwhisper
    license: LicenseRef-proprietary AND MIT
    deps: [gtk4, gtk4-layer-shell, python3-gobject, pipewire-pulseaudio, foot]
    status: verified
    version: 1.0.0
    note: Proprietary Superwhisper dictation; verifies the vendor Minisign signature then installs under /opt/superwhisper (launcher, user service, desktop entries, fcitx5 addon, fonts/icons). Upstream lists it in omarchy-base.packages, so it is in the default first-party set. Container-built OK.
  omawrite:
    repo: https://github.com/omacom/omawrite
    language: cpp
    build: qmake6
    binary: omawrite
    license: MIT
    deps: [qt6-base, qt6-declarative, qt6-quickcontrols2, xdg-desktop-portal]
    status: verified
    version: 0.6.0
    note: Built in Fedora Rawhide container (v0.5.0); Qt6 markdown editor.
  omasnap:
    repo: https://github.com/tobi/omasnap
    language: cpp
    build: repack-release (prebuilt Arch x86_64 /usr tree, no compile)
    binary: omasnap
    license: MIT
    deps: [hyprland, layer-shell-qt, wl-clipboard, qt6-qtbase]
    status: verified
    version: 1.21.0
    note: Repack of omasnap-1.21.0-archlinux-x86_64.tar.gz (mirrors AUR omasnap-bin); screenshot/annotation editor that supersedes tensaku. Container-built OK.
  owe:
    repo: https://github.com/omacom/owe
    language: c
    build: meson
    binary: owe, owed, owe-render, owe-idle
    license: MIT
    deps: [mpv, ffmpeg-free, socat, wayland-devel, libglvnd-devel, libepoxy-devel, systemd-devel]
    status: verified
    version: 0.2.10
    note: OWE wallpaper engine (owed daemon + owe CLI + owe-render); desktop video backgrounds, feeds the lock screen via owe-lockfeed. Container-built OK.
  owe-lockfeed:
    repo: https://github.com/omacom/owe
    language: cpp
    build: cmake (qml-plugin/ subtree)
    binary: null
    license: MIT
    deps: [qt6-qtdeclarative]
    status: verified
    version: 0.2.10
    note: Qt6 QML module Owe.LockFeed from the same omacom/owe tag archive as `owe`; this is the package Omarchy splits out of the AUR owe build. Container-built OK.
  tensaku:
    repo: https://github.com/jondkinney/tensaku
    language: rust
    build: repack-release (release tarball carries full install tree, no toolchain)
    binary: tensaku, tensaku-edit
    license: MPL-2.0
    deps: [gtk4, gtk4-layer-shell, libadwaita, fontconfig]
    status: verified
    version: 0.29.0
    note: Repack of tensaku-v0.29.0-x86_64.tar.gz (bin/ + share/); desktop + icon + man + completions. Container-built OK.
  tobi-try:
    repo: https://github.com/tobi/try
    language: ruby
    build: gem (try-cli)
    binary: try
    license: MIT
    deps: [ruby]
    status: verified
    version: 1.10.1
    note: Built in Fedora Rawhide container (try-cli v1.10.1 gem).
  ttfx:
    repo: https://github.com/omacom/ttfx
    language: rust
    build: cargo-release (crates.io deps vendored for offline COPR build)
    binary: ttfx
    license: MIT
    deps: []
    status: verified
    version: 0.5.0
    note: Built in Fedora Rawhide container (v0.3.2); pure Rust. Crates vendored via fedora/rpm/vendor-rust.sh; cargo build --offline --locked.

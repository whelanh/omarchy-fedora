# First-party COPR packages that have been retired and should be removed from
# whelanh/omarchy, one SRPM Name per line (comments + blanks ignored).
#
# Deleting a spec from fedora/rpm/ (and its manifest.yaml entry) stops NEW
# builds — auto-update.sh/check-updates.sh/submit-builds.sh only touch
# `status: verified` packages — but the COPR keeps the source package and every
# build it produced. `delete-retired.sh` removes the packages listed here so the
# project (and `dnf copr enable` users) stop seeing them.
#
# Add a name here when a package goes away; it is safe to re-run (a package
# already gone is skipped, not an error).
elsewhen
openai-codex-bin
tensaku

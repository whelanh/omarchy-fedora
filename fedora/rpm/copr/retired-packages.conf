# First-party COPR packages that have been retired and should be removed from
# whelanh/omarchy, one SRPM Name per line (comments + blanks ignored).
#
# Deleting a spec from fedora/rpm/ (and its manifest.yaml entry) stops NEW
# builds — auto-update.sh/check-updates.sh/submit-builds.sh only touch
# `status: verified` packages — but the COPR keeps the source package and every
# build it produced. `delete-retired.sh` removes the packages listed here so the
# project (and `dnf copr enable` users) stop seeing them.
#
# Add a name here when a package goes away; it is safe to re-run (a package
# already gone is skipped, not an error).
elsewhen
openai-codex-bin
tensaku
# Not a package that went away, but a name we had to give up: Fedora ships its
# own unrelated `folio` (Toolstack's note-taking app, 26.x), so `dnf install
# folio` never installed our file manager. The RPM is now omarchy-folio; the old
# COPR `folio` must be deleted so users stop resolving to it.
folio
# Cards and Checkmate: upstream replaced both desktop apps with web pages inside
# Game Vibes (64c0b627c) and dropped them from omarchy-base.packages. Their specs
# and manifest entries are gone, so nothing builds them any more; these lines
# delete the published RPMs from the COPR.
cards
checkmate

# Menu package translation (Arch/AUR name -> Fedora install strategy).
#
# The Omarchy SUPER+SPACE Install rows call omarchy-pkg-add / -present with
# Arch/AUR package names. fedora/scripts/lib/pkg.sh reads this file to map them
# to a Fedora strategy. It is a flat, comment-tolerant table parsed in bash so
# the runtime shim needs no Python/PyYAML.
#
# Format: arch_name|source|package(s)|repository|command|desktop|fallback
#   source
#     fedora       dnf install package(s) (Fedora official or RPM Fusion)
#     copr         enable repository (owner/name), then dnf install package(s)
#     repo         add a vendor .repo file (repository = URL), then dnf install
#     rpm          dnf install a direct RPM URL (repository = URL)
#     flatpak      flatpak install from Flathub (package = app id)
#     unavailable  no Fedora/Flathub source; the shim warns and skips
#   package(s)   space-separated dnf names, or one Flatpak app id
#   repository   owner/name (copr) | .repo URL (repo) | RPM URL (rpm)
#   command      executable upstream launches (Flatpak fallback installs a
#                /usr/bin wrapper for it), else empty
#   desktop      desktop id upstream expects (Flatpak installs a NoDisplay
#                alias for it), else empty
#   fallback     Flatpak app id to use when a native source fails/absent
#
# Names not listed pass through to dnf unchanged. Vendor/COPR native sources
# usually target stable Fedora, so on rawhide the fallback (Flathub) is used.
# Keep sorted by arch_name.

# --- name translations (package exists in Fedora under another name) ---
vim|fedora|vim-enhanced||||

# --- native first, Flathub fallback ---
brave-bin|repo|brave-browser|https://brave-browser-rpm-release.s3.brave.com/brave-browser.repo|brave|brave-browser.desktop|com.brave.Browser
google-chrome|rpm|google-chrome-stable|https://dl.google.com/linux/direct/google-chrome-stable_current_x86_64.rpm|google-chrome-stable|google-chrome.desktop|com.google.Chrome
zen-browser-bin|copr|zen-browser|xgrind/applications|zen-browser|zen.desktop|app.zen_browser.zen
zed|copr|zed|xgrind/applications|zed|dev.zed.Zed.desktop|dev.zed.Zed
bitwarden|copr|bitwarden|xgrind/applications|bitwarden|bitwarden.desktop|com.bitwarden.desktop

# --- native only (COPR covers all enabled chroots) ---
ghostty|copr|ghostty|boydkelly/ghostty-nightly|||
xpadneo-dkms|copr|xpadneo|neovi/xpadneo|||

# --- Flathub only (no usable native source) ---
microsoft-edge-stable-bin|flatpak|com.microsoft.Edge||microsoft-edge-stable|microsoft-edge.desktop|
visual-studio-code-bin|flatpak|com.visualstudio.code||code|code.desktop|
sublime-text-4|flatpak|com.sublimetext.three||subl|sublime_text.desktop|
spotify|flatpak|com.spotify.Client||spotify|spotify.desktop|
signal-desktop|flatpak|org.signal.Signal||signal-desktop|signal-desktop.desktop|
1password|flatpak|com.onepassword.OnePassword||1password|1password.desktop|
dropbox|flatpak|com.dropbox.Client||dropbox|dropbox.desktop|
minecraft-launcher|flatpak|com.mojang.Minecraft||minecraft-launcher|minecraft-launcher.desktop|
heroic-games-launcher-bin|flatpak|com.heroicgameslauncher.hgl||heroic|com.heroicgameslauncher.hgl.desktop|

# --- No Fedora/Flathub source: shim warns and skips (install row still opens) ---

# Known, accepted package-drift rows for `check-updates.sh --packages`.
#
# Each line is an upstream package name (the key in packages.yaml) that is
# currently either unmapped (upstream ships it, we do not) or stale (we map it,
# upstream no longer lists it). `--packages` suppresses these rows so the report
# only shows NEW drift; add a line only after triaging the gap, and delete it
# once the row is fixed so the baseline stays honest.
#
# Retired packages and mappings classified `source: official`, `drop` or
# `unavailable` are already filtered out by the check and must not be listed.

# --- Unmapped upstream packages (hardware / kernel / camera extras) ---
apple-bcm-firmware-fetcher        # Apple T2 hardware; apple-* mappings are unavailable
asus-proart-p14-audio             # ASUS laptop audio quirk; no Fedora package
asus-zenbook-14-ux3480qa-audio    # ASUS laptop audio quirk; no Fedora package
asus-zenbook-a16-audio            # ASUS laptop audio quirk; no Fedora package
asus-zenbook-a16-firmware         # hardware firmware; vendor-specific, not packaged
broadcom-wl-dkms                  # Fedora maps rpmfusion broadcom-wl instead
iptsd                             # Intel touchscreen daemon; not packaged in Fedora
linux-firmware-cirrus-dx13260     # firmware split; Fedora linux-firmware covers it
linux-omarchy                     # upstream kernel; Fedora uses the official kernel
linux-omarchy-headers             # upstream kernel headers; Fedora uses kernel-devel
linux-omarchy-nvidia-open         # upstream kernel module; Fedora akmod covers NVIDIA
microsoft-surface-pro-11-sensors  # Surface hardware; not packaged in Fedora
microsoft-surface-pro-11-support  # Surface hardware; not packaged in Fedora
pipewire-libcamera                # camera support; not installed by default
v4l2-relayd                       # camera relay; not packaged / not needed
v4l2loopback-dkms                 # virtual-camera module; not installed by default
v4l2loopback-utils                # virtual-camera tooling; not installed by default

# --- Stale mappings (we map, upstream no longer lists) ---
broadcom-wl                       # upstream uses broadcom-wl-dkms; rpmfusion broadcom-wl retained
btrfs-assistant                   # upstream dropped it; mapping kept but not installed
lazydocker                        # upstream dropped from new installs but preserves existing machines
linux                             # substitute: Fedora official kernel
linux-headers                     # substitute: Fedora kernel-devel
chromium                          # kept as the google-chrome substitute (upstream made Chrome default in b10da7e59)
moonlight-qt                      # dropped from new installs upstream; kept as opt-in gaming extra
omapresent                        # Fedora-side successor to hype (upstream still ships hype)
owe-lockfeed                      # Fedora-side split of owe's lock-screen module
power-profiles-daemon             # kept on Fedora; upstream dropped it
xorg-xsetroot                     # dropped with startup-cursor.lua; kept installed (X11 cursor workaround)

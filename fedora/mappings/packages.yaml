# Fedora package mapping for Omarchy Quattro
#
# Target: Fedora Rawhide (~43+), x86_64, Wayland-capable hardware.
#
# Each Arch/upstream package (from install/omarchy-base.packages and
# install/omarchy-other.packages) maps to a Fedora package name and a source.
#
# source classification:
#   fedora          Fedora official repositories (fedora / updates / rawhide)
#   copr            COPR repository (repository key names a repo in repositories.yaml)
#   rpmfusion       RPM Fusion free/nonfree (repository key names a repo)
#   flatpak         Flathub flatpak (installed via flatpak, not dnf)
#   substitute      functionally equivalent, different source/package
#   build           must be built from source as an RPM (Omarchy first-party)
#   drop            Arch-only tooling not needed on Fedora
#   unavailable     no reasonable Fedora equivalent (hardware/kernel specific)
#
# NOTE: never silently substitute unrelated software. Every substitute is
# commented with the compatibility rationale.

packages:
  # --- Omarchy "first-party" binaries, shipped from the whelanh/omarchy COPR ---
  # Each maps to a SPEC under fedora/rpm/ (status in fedora/rpm/manifest.yaml;
  # build + publish tooling in fedora/rpm/copr/). Fedora official does not ship
  # these; they are source-built or repacked as Fedora RPMs.
  aether:
    package: aether
    source: copr
    repository: whelanh/omarchy
    rpm: fedora/rpm/aether/aether.spec
    note: Desktop theming (wallpaper colour); Go/Wails, repacked as prebuilt release binary.
  cliamp:
    package: cliamp
    source: copr
    repository: whelanh/omarchy
    rpm: fedora/rpm/cliamp/cliamp.spec
    note: Terminal music player; Go/CGO with ALSA deps, repacked from release binary.
  herdr:
    package: herdr
    source: copr
    repository: whelanh/omarchy
    rpm: fedora/rpm/herdr/herdr.spec
    note: AI-agent workspace manager; Rust, repacked from herdrdev/herdr release binary.
  hyprland-preview-share-picker:
    package: hyprland-preview-share-picker
    source: copr
    repository: whelanh/omarchy
    rpm: fedora/rpm/hyprland-preview-share-picker/hyprland-preview-share-picker.spec
    note: Rust GTK4 share picker; source-built on stable Rust, vendored hyprland-protocols.
  omacalc:
    package: omacalc
    source: copr
    repository: whelanh/omarchy
    rpm: fedora/rpm/omacalc/omacalc.spec
    note: Calculator; Qt6/qmake6.
  omacut:
    package: omacut
    source: copr
    repository: whelanh/omarchy
    rpm: fedora/rpm/omacut/omacut.spec
    note: Video length trimmer; Qt6/qmake6, needs qt6-multimedia + ffmpeg.
  omawrite:
    package: omawrite
    source: copr
    repository: whelanh/omarchy
    rpm: fedora/rpm/omawrite/omawrite.spec
    note: Markdown editor; Qt6/qmake6 with quickcontrols2.
  tensaku:
    package: tensaku
    source: copr
    repository: whelanh/omarchy
    rpm: fedora/rpm/tensaku/tensaku.spec
    note: Screenshot annotator (Satty fork); repacked from release tarball tree.
  tobi-try:
    package: try
    source: copr
    repository: whelanh/omarchy
    rpm: fedora/rpm/tobi-try/tobi-try.spec
    note: Ephemeral workspace manager; Ruby gem try-cli. dnf name is `try`.
  ttfx:
    package: ttfx
    source: copr
    repository: whelanh/omarchy
    rpm: fedora/rpm/ttfx/ttfx.spec
    note: Terminal text-effects engine; pure Rust/cargo.

  # Dropped from RPM scope (were part of the original 13). Classified so the
  # upstream base package list still resolves; see fedora/rpm/README.md.
  asdcontrol:
    package: null
    source: drop
    note: Upstream archived Aug 2025, Apple Studio Display only; not on Fedora.
  omarchy-nvim:
    package: null
    source: drop
    note: In-tree LazyVim cache assembly, not a standalone RPM.
  usage:
    package: null
    source: drop
    note: Shipped in-tree by the base install; an RPM would file-conflict.


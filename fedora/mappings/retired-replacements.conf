# Retired Fedora packages whose removal depends on a replacement existing.
#
# When upstream replaces a package, the old one goes into
# retired-packages.conf so `omarchy update` prunes it. Pruning the old package
# before the replacement is actually installed leaves the user without the
# capability in the meantime — for real, when the replacement is a first-party
# RPM that has not been published in whelanh/omarchy yet (COPR outage, a failed
# publish, or a version that is still building).
#
# Format: <retired-package> <replacement-package>
#
# A retired package listed here is only removed once the replacement is
# installed. Rows for packages that are not in retired-packages.conf are
# ignored. Keep this list short: only add a row when removing the old package
# would take away something the user still needs.
nautilus          omarchy-folio
nautilus-python   omarchy-folio
sushi             omarchy-folio

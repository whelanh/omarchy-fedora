# Fedora repository (COPR / RPM Fusion) management for Omarchy Quattro
#
# Each external repository used by this project is documented here:
#   - owner / id
#   - packages supplied
#   - why Fedora official is insufficient
#   - trust / security considerations
#   - mandatory vs optional
#
# We prefer Fedora official packages whenever functionally adequate. Only
# enable repositories listed here; never add arbitrary repos.
#
# To enable on a live system:
#   dnf install -y 'dnf-command(copr)' dnf-plugins-core
#   dnf copr enable -y <owner>/<name>
#
# RPM Fusion (for NVIDIA / nonfree codecs) is enabled via its upstream RPM:
#   dnf install -y https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm
#   dnf install -y https://download1.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-$(rpm -E %fedora).noarch.rpm

repositories:
  nett00n/hyprland:
    kind: copr
    mandatory: true
    packages:
      - hyprland-guiutils
      - hyprpicker
      - hyprsunset
      - quickshell
      - uwsm
      - xdg-desktop-portal-hyprland
      - gtk4-layer-shell
    why_not_official: >
      Fedora official repos ship hyprland and quickshell (Rawhide), but the
      surrounding Hyprland ecosystem (hyprpicker, hyprsunset, uwsm,
      hyprland-guiutils, xdg-desktop-portal-hyprland, gtk4-layer-shell) is not
      in official Fedora repos. nett00n/hyprland is the actively-maintained COPR
      for the full ecosystem as of 2026.
    trust: >
      Community-maintained COPR. Packages built on Fedora's COPR infra from
      upstream sources; verified with COPR GPG key and gpgcheck=1. Review the
      source specs before trusting.
    optional: false

  brycensranch/gpu-screen-recorder-git:
    kind: copr
    mandatory: false
    packages:
      - gpu-screen-recorder
    why_not_official: >
      gpu-screen-recorder (NVIDIA/AMD screen recorder used by Omarchy
      screenshots) is not in official Fedora repos.
    trust: Community COPR; gpgcheck on.
    optional: true

  ferdiu/moonlight:
    kind: copr
    mandatory: false
    packages:
      - moonlight-qt
    why_not_official: moonlight-qt (game streaming) not in official Fedora.
    trust: Community COPR; gpgcheck on.
    optional: true

  kmf/Obsidian:
    kind: copr
    mandatory: false
    packages:
      - obsidian
    why_not_official: Obsidian not in official Fedora; alternative is Flathub.
    trust: Community COPR; gpgcheck on.
    optional: true

  lukenukem/asus-linux:
    kind: copr
    mandatory: false
    packages:
      - asusctl
    why_not_official: asusctl (ASUS ROG) not in official Fedora.
    trust: Community COPR from the asus-linux project.
    optional: true

  rpmfusion-nonfree-updates:
    kind: rpmfusion
    mandatory: false
    packages:
      - akmod-nvidia
      - xorg-x11-drv-nvidia
      - libva-nvidia-driver
      - broadcom-wl
    why_not_official: >
      NVIDIA proprietary drivers and Broadcom wireless firmware are legally
      redistributed via RPM Fusion nonfree, not official Fedora.
    trust: >
      RPM Fusion is the established community third-party repo for Fedora.
      Enabled by installing the official rpmfusion-release RPM (signed).
    optional: true
    note: Nonfree NVIDIA/Broadcom support is optional; base install does not require it.

  atim/lazygit:
    kind: copr
    mandatory: true
    packages:
      - lazygit
    why_not_official: >
      lazygit (terminal GUI for git), used by the Omarchy shell for git
      workflows, is not packaged in official Fedora (Rust packaging rules).
      atim/lazygit is the COPR referenced by lazygit upstream docs.
    trust: Community COPR; gpgcheck on.
    optional: false

  atim/lazydocker:
    kind: copr
    mandatory: true
    packages:
      - lazydocker
    why_not_official: >
      lazydocker (terminal GUI for docker) is not packaged in official Fedora.
      atim/lazydocker follows the same build pattern as atim/lazygit.
    trust: Community COPR; gpgcheck on.
    optional: false

  atim/starship:
    kind: copr
    mandatory: true
    packages:
      - starship
    why_not_official: >
      starship (cross-shell prompt) was retired from official Fedora in 2019
      because of strict Rust vendoring rules. atim/starship is the COPR listed
      on starship's official install docs.
    trust: Community COPR; gpgcheck on.
    optional: false

  whelanh/omarchy:
    kind: copr
    mandatory: false
    packages:
      - aether
      - cliamp
      - herdr
      - hyprland-preview-share-picker
      - omacalc
      - omacut
      - omawrite
      - tensaku
      - try
      - ttfx
    why_not_official: >
      The 10 first-party Omarchy binaries are built/repacked from
      fedora/rpm/ SPECs (see fedora/rpm/README.md) and published to this COPR;
      they are not in official Fedora and several upstream projects don't
      publish Fedora binaries at all.
    trust: >
      First-party Omarchy project. Built by this repo's CI from the SPECs
      under fedora/rpm/. gpgcheck on via COPR GPG signing. All repacks are
      byte-for-byte upstream release binaries.
    optional: true
    note: >
      Container-verified end-to-end (all 10 built green on fedora:rawhide via
      fedora/rpm/build-rpm-in-ci.sh).

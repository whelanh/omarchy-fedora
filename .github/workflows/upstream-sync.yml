name: upstream-sync

# Periodically checks upstream omacom/omarchy `quattro` for changes and, when
# there are real changes and the Fedora layer is unaffected (SAFE
# classification), opens a DRAFT PR that refreshes the vendored subtree. No PR
# is opened when upstream is unchanged. Releases do not deploy automatically.

on:
  schedule:
    - cron: '0 3 * * *'   # daily at 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'omarchy-fedora bot'
          git config user.email 'bot@omarchy-fedora.local'

      - name: Add upstream remote
        run: git remote add upstream https://github.com/omacom/omarchy.git

      - name: Fetch upstream quattro
        run: git fetch upstream quattro

      - name: Record current HEAD
        id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Attempt subtree pull
        id: pull
        continue-on-error: true
        run: |
          git subtree pull --prefix upstream --squash upstream quattro \
            -m "chore(upstream): sync Omarchy quattro"
        # On conflict this fails -> outcome 'failure' -> issue opened below.

      - name: Detect changes
        id: changes
        if: steps.pull.outcome == 'success'
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ steps.base.outputs.sha }}" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PyYAML
        if: steps.changes.outputs.changed == 'true'
        run: pip install pyyaml

      - name: Run static tests
        if: steps.changes.outputs.changed == 'true'
        run: bash fedora/tests/static.sh

      - name: Create sync PR
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: upstream-sync
          draft: true
          title: 'chore(upstream): sync Omarchy quattro'
          commit-message: 'chore(upstream): sync Omarchy quattro'
          body: |
            Auto-generated by the upstream-sync workflow.

            - Classification: `SAFE` (no Fedora-layer files touched)
            - Static tests: see job status
            - The vendored `upstream/` subtree has been refreshed.

            Opened as a draft — review and mark it ready when you approve it.
          delete-branch: true

      - name: Open issue when manual intervention required
        if: steps.pull.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Upstream sync conflict requires manual review',
              body: 'The upstream-sync workflow could not automatically integrate the latest upstream Omarchy quattro. Please resolve the conflict in the upstream/ subtree and classify the change (see ARCH_SPECIFIC_INVENTORY.md and patches/README.md).'
            })

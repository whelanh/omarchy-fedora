name: fedora-build

# Validates that the Fedora package manifests and resolver produce a coherent,
# parseable set. A real RPM/environment-group build requires a Fedora container
# and is wired separately (see integration-test).
#
# Triggers:
#   - push to main / pull_request: static + manifest/scaffold checks (PRs stop
#     there; rpm-build is skipped on PRs to keep them fast).
#   - schedule (weekly) + workflow_dispatch: the full set runs, including
#     rpm-build, so the committed specs are container-built even when nothing is
#     pushed. This catches Fedora rawhide/toolchain moves and upstream release
#     assets disappearing without a version change.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'   # Mondays 04:00 UTC
  workflow_dispatch: {}

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run static test suite
        run: bash fedora/tests/static.sh

  manifest-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate every upstream package is classified
        run: |
          set -e
          while IFS= read -r pkg; do
            pkg="${pkg%%#*}"; pkg="${pkg//[[:space:]]/}"
            [ -z "$pkg" ] && continue
            python3 fedora/scripts/lib/resolve.py --package "$pkg" >/dev/null || {
              echo "Unmapped upstream package: $pkg"; exit 1
            }
          done < upstream/install/omarchy-base.packages
          echo "All upstream base packages are mapped."

  rpm-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Validate first-party RPM scaffold (manifest <-> spec)
        run: |
          set -e
          cd fedora/rpm
          python3 - <<'PY'
          import os, yaml
          d = yaml.safe_load(open('manifest.yaml'))
          pkgs = d['packages']
          for name, p in pkgs.items():
              assert os.path.isfile(f"{name}/{name}.spec"), f"missing spec {name}"
              # 'retired': kept only for migrations; never built/published.
              assert p['status'] in ('verified', 'blocked', 'retired'), name
          # Every spec directory must have a manifest entry (and vice-versa), so
          # the two can't drift the way a hard-coded package count did.
          specs = sorted(f for f in os.listdir('.') if os.path.isfile(f"{f}/{f}.spec"))
          orphans = [s for s in specs if s not in pkgs]
          assert not orphans, f"specs without a manifest entry: {orphans}"
          print(f"OK: {len(pkgs)} manifest entries / {len(specs)} specs validated")
          PY

  list-rpms:
    # Collect the verified first-party specs so rpm-build can fan out one job
    # per package (matrix). Each package then builds in its OWN fresh container,
    # so BuildRequires installed for one package can never affect another.
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install pyyaml
      - id: list
        name: List verified first-party RPMs
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, yaml
          d = yaml.safe_load(open('fedora/rpm/manifest.yaml'))['packages']
          pkgs = sorted(p for p, v in d.items() if v.get('status') == 'verified')
          print('packages=' + json.dumps(pkgs))
          PY

  rpm-build:
    # Builds each 'verified' first-party RPM in its own Fedora Rawhide container
    # to confirm it actually produces a package. Runs on push to main, on the
    # weekly schedule, and on manual workflow_dispatch (not per-PR, since it
    # downloads build deps from the network and takes minutes).
    needs: list-rpms
    if: github.event_name != 'pull_request'
    # The heaviest job in this matrix (gliff: a 12-crate Rust workspace built
    # against gtk4 + libadwaita, with openh264 compiled from source) still
    # finishes in ~7 minutes. 25 minutes is generous headroom, and it bounds a
    # wedged dnf/cargo/network fetch so the job fails WITH logs instead of being
    # killed silently — see run 39235962963, where a 49-minute attempt uploaded
    # no log at all.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.list-rpms.outputs.packages) }}
    runs-on: ubuntu-latest
    container:
      image: fedora:rawhide
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        # The same retry rationale as dnf_builddep_retry in
        # build-rpm-in-ci.sh: a single slow mirror must not redden a matrix leg.
        run: dnf -y --setopt=retries=5 --setopt=timeout=60 install rpm-build dnf-plugins-core python3-pyyaml
      # Some verified specs need devel packages official Fedora doesn't ship:
      # omarchy-hyprland-titlebars builds against hyprland-devel from this COPR
      # (the same per-chroot build repo the whelanh/omarchy COPR project sets).
      - name: Enable build-time repos (nett00n/hyprland)
        run: dnf -y copr enable nett00n/hyprland
      - name: Build ${{ matrix.package }}
        # Bounds a single package build so a stall is attributed to the right
        # step; the job-level timeout above is the outer backstop.
        timeout-minutes: 20
        run: bash fedora/rpm/build-rpm-in-ci.sh ${{ matrix.package }}
